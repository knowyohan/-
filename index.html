<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>열공 스터디 타이머</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      background-size: cover;
      background-position: center;
      transition: background-image 0.3s ease;
      padding: 20px;
    }

    .timer-card {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
    }

    h2 { font-size: 1.5rem; margin-bottom: 1.2rem; }

    /* 과목 선택 및 추가 영역 */
    .subject-section {
      display: flex;
      gap: 8px;
      margin-bottom: 1.2rem;
    }

    select, input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 0.95rem;
      outline: none;
    }

    select option { background: #222; color: white; }

    .btn-add {
      padding: 10px 14px;
      background: #4b5563;
      white-space: nowrap;
    }
    .btn-add:hover { background: #6b7280; }

    /* 타이머 디스플레이 */
    .timer {
      font-size: 3.2rem;
      font-weight: 700;
      font-family: monospace;
      margin: 0.8rem 0 1.5rem;
      letter-spacing: 2px;
      color: #60a5fa;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    button, .file-label {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover, .file-label:hover { background: #2563eb; }
    button:active, .file-label:active { transform: scale(0.98); }

    button#pauseBtn { background: #ef4444; }
    button#pauseBtn:hover { background: #dc2626; }

    button#resetBtn { background: #6b7280; }
    button#resetBtn:hover { background: #4b5563; }

    /* 오늘 공부 기록 영역 */
    .stats-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.95rem;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 8px;
    }

    .stats-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.9rem;
    }

    .stats-list li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: #e5e7eb;
    }

    input[type="file"] { display: none; }

    .file-label {
      display: inline-block;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
    }
    .file-label:hover { background: rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body>

  <div class="timer-card">
    <h2>🔥 열공 스톱워치</h2>

    <!-- 과목 선택 및 추가 -->
    <div class="subject-section">
      <select id="subjectSelect"></select>
      <button class="btn-add" id="addSubjectBtn">+ 과목 추가</button>
    </div>

    <!-- 타이머 표시 -->
    <div class="timer" id="timer">00:00:00</div>
    
    <!-- 조작 버튼 -->
    <div class="btn-group">
      <button id="startBtn">시작</button>
      <button id="pauseBtn">일시정지</button>
      <button id="resetBtn">초기화</button>
    </div>

    <!-- 오늘 과목별 기록 요약 -->
    <div class="stats-card">
      <div class="stats-header">
        <span>📅 오늘 총 공부</span>
        <span id="totalTodayTime">00:00:00</span>
      </div>
      <ul class="stats-list" id="statsList">
        <!-- 과목별 시간 목록이 생성됨 -->
      </ul>
    </div>

    <!-- 배경사진 업로드 -->
    <label for="bgInput" class="file-label">🖼️ 배경 사진 선택</label>
    <input type="file" id="bgInput" accept="image/*">
  </div>

  <script>
    // ----------------------------------------------------
    // 1. 상태 및 데이터 초기화
    // ----------------------------------------------------
    let timerId = null;

    // 과목 목록 (기본값)
    let subjects = JSON.parse(localStorage.getItem('studySubjects')) || ['국어', '수학', '영어'];
    
    // 일간 공부 기록 데이터 구조:
    // { "2026-09-18": { "국어": 3600, "수학": 1800 } }
    let studyData = JSON.parse(localStorage.getItem('studyData')) || {};

    // 오늘 날짜 문자열 반환 (YYYY-MM-DD)
    function getTodayKey() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const todayKey = getTodayKey();
    if (!studyData[todayKey]) {
      studyData[todayKey] = {};
    }

    // ----------------------------------------------------
    // 2. DOM 요소 가져오기
    // ----------------------------------------------------
    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bgInput = document.getElementById('bgInput');
    const subjectSelect = document.getElementById('subjectSelect');
    const addSubjectBtn = document.getElementById('addSubjectBtn');
    const statsList = document.getElementById('statsList');
    const totalTodayTimeDisplay = document.getElementById('totalTodayTime');

    // ----------------------------------------------------
    // 3. 헬퍼 및 렌더링 함수
    // ----------------------------------------------------
    // 초 -> HH:MM:SS 변환
    function formatTime(totalSec) {
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    // 과목 드롭다운 업데이트
    function renderSubjects() {
      subjectSelect.innerHTML = '';
      subjects.forEach(sub => {
        const option = document.createElement('option');
        option.value = sub;
        option.textContent = sub;
        subjectSelect.appendChild(option);
      });
    }

    // 선택된 과목의 오늘 공부 시간을 타이머 화면에 표시
    function updateTimerDisplay() {
      const currentSubject = subjectSelect.value;
      const currentSec = studyData[todayKey][currentSubject] || 0;
      timerDisplay.textContent = formatTime(currentSec);
    }

    // 통계 및 기록 화면 갱신
    function updateStatsDisplay() {
      statsList.innerHTML = '';
      let grandTotal = 0;

      subjects.forEach(sub => {
        const sec = studyData[todayKey][sub] || 0;
        grandTotal += sec;

        const li = document.createElement('li');
        li.innerHTML = `<span>${sub}</span><span>${formatTime(sec)}</span>`;
        statsList.appendChild(li);
      });

      totalTodayTimeDisplay.textContent = formatTime(grandTotal);
    }

    // 데이터 localStorage에 보관
    function saveData() {
      localStorage.setItem('studySubjects', JSON.stringify(subjects));
      localStorage.setItem('studyData', JSON.stringify(studyData));
    }

    // ----------------------------------------------------
    // 4. 타이머 동작 및 이벤트 처리
    // ----------------------------------------------------
    // 타이머 시작
    startBtn.addEventListener('click', () => {
      if (timerId) return;

      const currentSubject = subjectSelect.value;
      if (!currentSubject) {
        alert('과목을 먼저 선택하거나 추가해주세요.');
        return;
      }

      timerId = setInterval(() => {
        if (!studyData[todayKey][currentSubject]) {
          studyData[todayKey][currentSubject] = 0;
        }
        studyData[todayKey][currentSubject]++;

        updateTimerDisplay();
        updateStatsDisplay();
        saveData();
      }, 1000);
    });

    // 일시정지
    pauseBtn.addEventListener('click', () => {
      clearInterval(timerId);
      timerId = null;
    });

    // 선택 과목의 오늘 시간 초기화
    resetBtn.addEventListener('click', () => {
      const currentSubject = subjectSelect.value;
      if (confirm(`'${currentSubject}' 과목의 오늘 측정 시간을 초기화하시겠습니까?`)) {
        clearInterval(timerId);
        timerId = null;
        studyData[todayKey][currentSubject] = 0;
        updateTimerDisplay();
        updateStatsDisplay();
        saveData();
      }
    });

    // 과목 변경 시 타이머 일시정지 및 화면 갱신
    subjectSelect.addEventListener('change', () => {
      clearInterval(timerId);
      timerId = null;
      updateTimerDisplay();
    });

    // 새 과목 추가
    addSubjectBtn.addEventListener('click', () => {
      const newSubject = prompt('추가할 과목 이름을 입력하세요:');
      if (newSubject && newSubject.trim() !== '') {
        const trimmed = newSubject.trim();
        if (!subjects.includes(trimmed)) {
          subjects.push(trimmed);
          saveData();
          renderSubjects();
          subjectSelect.value = trimmed;
          updateTimerDisplay();
          updateStatsDisplay();
        } else {
          alert('이미 존재하는 과목입니다.');
        }
      }
    });

    // 배경화면 업로드 및 불러오기
    bgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const imageUrl = event.target.result;
          document.body.style.backgroundImage = `url(${imageUrl})`;
          try {
            localStorage.setItem('customBg', imageUrl);
          } catch(err) {
            console.warn('사진 용량이 너무 커서 브라우저 저장소에 저장되지 않았습니다.');
          }
        };
        reader.readAsDataURL(file);
      }
    });

    // ----------------------------------------------------
    // 5. 페이지 초기화 실행
    // ----------------------------------------------------
    const savedBg = localStorage.getItem('customBg');
    if (savedBg) {
      document.body.style.backgroundImage = `url(${savedBg})`;
    }

    renderSubjects();
    updateTimerDisplay();
    updateStatsDisplay();
  </script>
</body>
</html>
